name: AIGI02 dependency and CPU integration check
on:
  push:
    paths:
      - 'aigi02/**'
      - 'aigi02_tests/**'
      - 'aigi02_configs/**'
      - 'requirements-aigi02.txt'
      - '.github/workflows/aigi02-dependency-check.yml'
  pull_request:
    paths:
      - 'aigi02/**'
      - 'aigi02_tests/**'
      - 'aigi02_configs/**'
      - 'requirements-aigi02.txt'
      - '.github/workflows/aigi02-dependency-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matched CPU libraries and production dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools==69.5.1
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-aigi02.txt
          python -m pip check
          python -m pip freeze > dependency-freeze.txt
      - name: Import original architectures without downloading weights
        run: |
          python - <<'PY'
          import torch, compressai, diffusers, transformers, peft, pyiqa
          from models.DiT_IC import Codec, LatentConditionAlignment
          from models.latent_codec import LatentCodec
          from ELIC.elic_official import ELIC
          from diffusers import SanaTransformer2DModel, AutoencoderDC
          print('Architecture imports passed. CUDA:', torch.cuda.is_available())
          print('CPU dependency validation is not pretrained GPU validation.')
          PY
      - name: Run all CPU tests and verify original files
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest aigi02_tests -q -rs --junitxml=junit.xml 2>&1 | tee cpu-tests.txt
          python -m aigi02 verify-upstream | tee upstream-check.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aigi02-dependency-report
          path: |
            dependency-freeze.txt
            cpu-tests.txt
            junit.xml
            upstream-check.txt
          if-no-files-found: ignore
