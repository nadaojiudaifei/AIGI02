name: AIGI02 dependency compatibility check
on:
  push:
    paths:
      - '.github/workflows/aigi02-dependency-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matched CPU libraries and production dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 compressai==1.2.8 diffusers==0.35.2 transformers==4.56.2 peft==0.17.1 accelerate==1.1.0 huggingface-hub==0.34.4 datasets==4.1.1 Pillow==11.3.0 PyYAML==6.0.3 einops==0.8.1 lpips==0.1.4 pyiqa==0.1.15 taming-transformers==0.0.1 openai-clip==1.0.1 timm==1.0.25 torch-fidelity==0.3.0 torchmetrics==1.8.2 pytorch-msssim==1.0.0 tensorboard==2.20.0 sentencepiece==0.2.1 'protobuf>=4.25,<7' tqdm==4.67.1 'pytest>=8,<10' opencv-python==4.11.0.86 opencv-python-headless==4.11.0.86
          python -m pip check
      - name: Import actual original architectures without downloading weights
        run: |
          python - <<'PY'
          import torch, compressai, diffusers, transformers, peft, pyiqa
          from models.DiT_IC import Codec, LatentConditionAlignment
          from models.latent_codec import LatentCodec
          from ELIC.elic_official import ELIC
          from diffusers import SanaTransformer2DModel, AutoencoderDC
          print('Architecture imports passed. CUDA:', torch.cuda.is_available())
          print('This is CPU dependency validation, not pretrained GPU validation.')
          PY
          python -m pip freeze > dependency-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aigi02-dependency-report
          path: dependency-freeze.txt
          if-no-files-found: ignore
